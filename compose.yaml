services:
  app:
    build: .
    image: daily-affirmations
    container_name: daily-affirmations
    restart: unless-stopped
    # Only reachable from this machine; Tailscale Serve provides HTTPS to the tailnet.
    ports:
      - 127.0.0.1:4410:4410
    env_file:
      - path: .env
        required: false
    volumes:
      - data:/data

volumes:
  data:
